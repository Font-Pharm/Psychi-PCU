<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <!-- ฟอนต์ IBM Plex Sans Thai (โหลดแบบไม่บล็อกการแสดงผล) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <style>
    /* =================================================================
     * Design tokens (ตามแบบบนแคนวาส "ออกแบบ UI/UX ระบบยาฉีดจิตเวช รพ.สต.")
     * ================================================================= */
    :root {
      --primary: #0B6E4F; --primary-d: #08533C; --primary-l: #E6F2ED; --primary-t: #0B5A41;
      --blue: #1565C0; --blue-d: #0D47A1; --blue-l: #E8F0FB;
      --bg: #F5F7F8; --surface: #FFFFFF; --text: #1F2D33; --muted: #5B6B73; --line: #DDE4E8; --field: #B0BEC5;
      --warn: #B54708; --warn-t: #8A3A06; --warn-l: #FFF1E3; --warn-b: #F5C99A;
      --err: #B42318; --err-t: #8F1D14; --err-l: #FDECEA;
      --flag-l: #FFF8D6; --flag-b: #D4A900; --flag-t: #6B5300;
      --new: #5B2287; --new-l: #F3E8FB;
      --r: 14px; --r-sm: 10px; --tap: 48px;
      --font: 'IBM Plex Sans Thai', 'Leelawadee UI', 'Thonburi', sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 17px; line-height: 1.5; }
    a { color: var(--blue); } a:hover { color: var(--blue-d); }
    button, input, select, textarea { font-family: inherit; }
    :focus-visible { outline: 3px solid #8DB4EA; outline-offset: 2px; }
    [hidden] { display: none !important; }

    /* ===== โครงหน้า: เมนูด้านข้าง (คอมพิวเตอร์) / เมนูล่างจอ (มือถือ) ===== */
    .shell { display: flex; min-height: 100vh; }
    .side { width: 248px; flex: 0 0 248px; background: var(--surface); border-right: 1px solid var(--line);
      padding: 20px 14px; display: flex; flex-direction: column; gap: 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
    .brand .dot { width: 40px; height: 40px; border-radius: 999px; background: linear-gradient(135deg, var(--primary), var(--blue)); flex: 0 0 40px; }
    .brand b { display: block; font-size: 16px; line-height: 1.25; }
    .brand small { font-size: 12px; color: var(--muted); }
    .side nav { display: flex; flex-direction: column; gap: 2px; }
    .side nav button { height: 46px; border: 0; border-radius: var(--r-sm); background: none; padding: 0 12px; display: flex;
      align-items: center; gap: 10px; font-size: 16px; color: var(--text); cursor: pointer; text-align: left; }
    .side nav button:hover { background: #F0F3F5; }
    .side nav button.on { background: var(--primary-l); color: var(--primary-t); font-weight: 700; }
    .side nav button .lbl { flex: 1; }
    .side .who { margin-top: auto; border-top: 1px solid var(--line); padding: 12px 6px 0; font-size: 14px; color: var(--muted); }
    .side .who button { background: none; border: 0; padding: 4px 0; color: var(--blue); font-size: 14px; cursor: pointer; display: block; }
    .count { min-width: 24px; height: 24px; padding: 0 6px; border-radius: 999px; background: var(--warn); color: #fff; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .top { background: var(--surface); border-bottom: 1px solid var(--line); padding: 14px 20px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 5; }
    .top h1 { margin: 0; font-size: 24px; line-height: 1.2; }
    .top .sub { font-size: 15px; color: var(--muted); }
    .top .grow { flex: 1; min-width: 0; }
    .subnav { background: var(--surface); border-bottom: 1px solid var(--line); padding: 8px 16px; display: flex; gap: 8px; overflow-x: auto; }
    .subnav button { height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--field); background: var(--surface); font-size: 15px; white-space: nowrap; cursor: pointer; color: var(--text); }
    .subnav button.on { border: 2px solid var(--blue); background: var(--blue-l); color: var(--blue-d); font-weight: 700; }
    main#view { padding: 16px 20px 32px; max-width: 1120px; width: 100%; margin: 0 auto; }
    footer { text-align: center; color: var(--muted); font-size: 13px; padding: 16px 10px 24px; }
    .bottom { display: none; }
    @media (max-width: 767px) {
      .side { display: none; }
      .top { padding: 12px 16px; }
      .top h1 { font-size: 22px; }
      main#view { padding: 14px 14px 104px; }
      footer { padding-bottom: 96px; }
      .bottom { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
        background: var(--surface); border-top: 1px solid var(--line); padding: 6px 4px calc(10px + env(safe-area-inset-bottom)); }
      .bottom button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0;
        font-size: 13px; color: var(--muted); cursor: pointer; min-height: 56px; }
      .bottom button.on { color: var(--primary); font-weight: 700; }
      .bottom button.fab span.ic { width: 52px; height: 52px; margin-top: -22px; border-radius: 999px; background: var(--blue); color: #fff;
        display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(21, 101, 192, .35); }
      .bottom button.fab { color: var(--blue-d); font-weight: 600; }
    }

    /* ===== ส่วนประกอบ ===== */
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin-bottom: 14px; }
    .card h2 { font-size: 19px; margin: 0 0 10px; color: var(--text); }
    .sec-title { font-size: 17px; font-weight: 700; margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; }
    .sec-title.warn { color: var(--warn-t); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 14px; }
    label.f { display: flex; flex-direction: column; gap: 4px; font-size: 15px; color: var(--muted); }
    label.f span.req { color: var(--err); }
    input, select, textarea { width: 100%; min-height: var(--tap); font-size: 18px; padding: 8px 12px; border: 1px solid var(--field);
      border-radius: var(--r-sm); background: var(--surface); color: var(--text); }
    input:focus, select:focus { border: 2px solid var(--blue); box-shadow: 0 0 0 3px #CFE0F7; outline: none; }
    input[type=checkbox] { width: 22px; min-height: 22px; height: 22px; accent-color: var(--primary); }
    input.flag, select.flag { background: var(--flag-l); border: 2px solid var(--flag-b); }
    .flagmsg { color: var(--flag-t); font-size: 14px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); border: 0; border-radius: var(--r-sm);
      padding: 0 20px; font-size: 17px; font-weight: 600; cursor: pointer; background: var(--primary); color: #fff; text-decoration: none; }
    .btn:hover { background: var(--primary-d); color: #fff; }
    .btn.blue { background: var(--blue); } .btn.blue:hover { background: var(--blue-d); }
    .btn.red { background: var(--err); }
    .btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--field); font-weight: 400; }
    .btn.ghost:hover { background: #F0F3F5; color: var(--text); }
    .btn.sm { min-height: 40px; padding: 0 14px; font-size: 15px; }
    .btn.block { width: 100%; }
    .btn:disabled { background: #CFD8DC; color: var(--muted); cursor: not-allowed; border: 0; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .row > * { flex: 1; min-width: 150px; }
    .row > .btn, .row > label.chk { flex: 0 0 auto; min-width: 0; }
    .muted { color: var(--muted); font-size: 15px; }
    .tw { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 16px; }
    th { background: #F0F5F3; color: var(--primary-t); text-align: left; padding: 10px; white-space: nowrap; font-weight: 700; }
    td { border-bottom: 1px solid #E6ECEF; padding: 10px; vertical-align: top; }
    .badge { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 14px; font-weight: 600; white-space: nowrap; }
    .b-pending { background: var(--blue-l); color: var(--blue-d); }
    .b-done { background: var(--primary-l); color: var(--primary-t); }
    .b-missed { background: var(--err-l); color: var(--err-t); }
    .b-overdue { background: var(--warn-l); color: var(--warn-t); }
    .b-cancelled { background: #ECEFF1; color: #455A64; }
    .b-new { background: var(--new-l); color: var(--new); }
    .alert { border-radius: 12px; padding: 12px 14px; margin: 10px 0; font-size: 16px; display: block; }
    .alert.err { background: var(--err-l); color: var(--err-t); }
    .alert.warn { background: var(--warn-l); color: var(--warn-t); }
    .alert.ok { background: var(--primary-l); color: var(--primary-t); }
    .alert.info { background: var(--flag-l); color: #5C4A00; border: 1px solid #E8D27A; }
    .alert ul { margin: 4px 0 0 20px; padding: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 4px; }
    .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; display: inline-block; min-width: 120px; margin: 0 6px 6px 0; }
    .stats .stat { margin: 0; }
    .stat small { display: block; font-size: 14px; color: var(--muted); }
    .stat b { display: block; font-size: 26px; line-height: 1.25; color: var(--text); }
    .stat.blue b { color: var(--blue); } .stat.green b { color: var(--primary); }
    .stat.warn { background: var(--warn-l); border-color: var(--warn-b); } .stat.warn small { color: var(--warn-t); } .stat.warn b { color: var(--warn); }
    .center { max-width: 440px; margin: 40px auto; text-align: center; }
    .login-btn { display: block; margin: 10px 0; padding: 13px; border-radius: 12px; color: #fff; text-decoration: none; font-size: 17px; font-weight: 600; }
    .login-btn:hover { color: #fff; filter: brightness(.95); }
    .photo-acts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .brand img { width: 44px; height: 44px; border-radius: 999px; flex: 0 0 44px; }
    #preview { max-width: 100%; max-height: 240px; border-radius: 12px; margin-top: 10px; display: none; }

    /* การ์ดผู้ป่วย (หน้าวันนี้) */
    .pcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px; }
    .pcard.overdue { border-color: var(--warn-b); }
    .pcard .nm { font-size: 19px; font-weight: 700; line-height: 1.3; }
    .pcard .hn { font-size: 15px; color: var(--muted); }
    .pcard .head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
    .pcard .acts { display: flex; gap: 8px; }
    .pcard .acts .btn.act-main { flex: 1; }
    .pcard .acts .btn.ghost { width: 108px; }
    .allergy { display: flex; align-items: center; gap: 6px; background: var(--err-l); color: var(--err-t); border-radius: 8px; padding: 6px 10px; font-size: 15px; font-weight: 600; }
    .pdone { background: var(--primary-l); border: 1px solid #B7D9CB; border-radius: var(--r); padding: 12px 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
    .pdone.missed { background: var(--err-l); border-color: #F2B8B3; }
    .pdone .ok { width: 36px; height: 36px; flex: 0 0 36px; border-radius: 999px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; }
    .pdone.missed .ok { background: var(--err); }
    .pdone .grow { flex: 1; min-width: 0; }
    .linkbtn { background: none; border: 0; color: var(--blue); font-size: 15px; cursor: pointer; padding: 8px; min-height: 44px; }
    .prow { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
    .prow .grow { flex: 1; min-width: 0; }
    .prow .nm { font-size: 17px; font-weight: 600; }
    .prow .sm { font-size: 14px; color: var(--muted); }
    .empty { border: 1px dashed var(--field); border-radius: var(--r); padding: 28px 16px; text-align: center; background: var(--surface); }
    .empty b { display: block; font-size: 18px; margin: 6px 0 2px; }
    .skel { background: #ECEFF1; border-radius: 8px; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .55; } }
    @media (prefers-reduced-motion: reduce) { .skel { animation: none; } }

    /* ขั้นตอน (หน้าสแกน) */
    .steps { list-style: none; margin: 0 0 14px; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .steps li { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); }
    .steps li::before { content: ''; height: 5px; border-radius: 999px; background: var(--line); }
    .steps li.done { color: var(--primary-t); font-weight: 600; } .steps li.done::before { background: var(--primary); }
    .steps li.now { color: var(--blue-d); font-weight: 700; } .steps li.now::before { background: var(--blue); }
    .actionbar { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 0; margin-top: 4px; z-index: 4; }
    @media (max-width: 767px) { .actionbar { bottom: 74px; margin: 0 -14px; padding: 12px 14px; } }

    /* ปฏิทิน */
    .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 14px; color: var(--muted); margin: 6px 0 10px; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .dot { width: 9px; height: 9px; border-radius: 999px; display: inline-block; }
    .d-done { background: var(--primary); } .d-pending { background: var(--blue); } .d-overdue { background: var(--warn); } .d-missed { background: var(--err); }
    .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
    .cal .h { text-align: center; font-size: 14px; color: var(--muted); padding: 2px 0; }
    .cal button.d { min-height: 56px; border: 1px solid transparent; border-radius: 10px; background: none; cursor: pointer; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 3px; font-size: 16px; color: var(--text); padding: 2px; }
    .cal button.d:hover { background: #F0F3F5; }
    .cal button.d.today { outline: 2px solid var(--blue); font-weight: 700; }
    .cal button.d.sel { background: var(--blue-l); }
    .cal .dots { display: flex; gap: 3px; height: 9px; }
    .cal .n { font-size: 11px; color: var(--muted); line-height: 1; }
    .monthbar { display: flex; align-items: center; gap: 8px; }
    .monthbar h2 { flex: 1; text-align: center; margin: 0; font-size: 21px; }
    .iconbtn { width: 46px; height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); }

    /* แผ่นล่าง (มือถือ) / หน้าต่างกลางจอ (คอมพิวเตอร์) */
    #sheet { position: fixed; inset: 0; background: rgba(15, 23, 28, .5); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
    #sheet.open { display: flex; }
    #sheetBox { background: var(--surface); border-radius: 18px; padding: 18px 20px 22px; width: 100%; max-width: 460px; max-height: 90vh; overflow: auto; }
    #sheetBox h2 { margin: 0 0 6px; font-size: 22px; }
    @media (max-width: 767px) {
      #sheet { align-items: flex-end; padding: 0; }
      #sheetBox { border-radius: 20px 20px 0 0; max-width: none; padding-bottom: calc(24px + env(safe-area-inset-bottom)); animation: up .2s ease-out; }
      #sheetBox::before { content: ''; display: block; width: 44px; height: 5px; border-radius: 999px; background: #CFD8DC; margin: -6px auto 12px; }
    }
    @keyframes up { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
    .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; margin: 6px 0 14px; }
    .seg button, .chips button { min-height: 50px; border: 1px solid var(--field); border-radius: 12px; background: var(--surface); font-size: 17px; cursor: pointer; color: var(--text); }
    .seg button[aria-pressed=true] { border: 2px solid var(--primary); background: var(--primary-l); color: var(--primary-t); font-weight: 700; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 10px; }
    .chips button { min-height: 44px; border-radius: 999px; padding: 0 16px; font-size: 16px; }
    .chips button[aria-pressed=true] { border: 2px solid var(--blue); background: var(--blue-l); color: var(--blue-d); font-weight: 700; }
    .fieldlabel { font-size: 16px; font-weight: 600; margin-top: 4px; }

    /* แจ้งเตือนสั้น / แถบโหลด */
    #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #263238; color: #fff; padding: 10px 12px 10px 16px;
      border-radius: 12px; display: none; align-items: center; gap: 12px; z-index: 60; font-size: 16px; max-width: calc(100% - 24px); box-shadow: 0 6px 20px rgba(0,0,0,.2); }
    #toast.open { display: flex; }
    #toast button { background: none; border: 0; color: #90CAF9; font-size: 16px; font-weight: 700; cursor: pointer; min-height: 40px; padding: 0 8px; }
    @media (max-width: 767px) { #toast { bottom: 96px; } }
    #bar { position: fixed; left: 0; top: 0; height: 3px; width: 0; background: var(--blue); z-index: 70; transition: width .3s; }
    #bar.on { width: 70%; transition: width 8s cubic-bezier(.1, .7, .3, 1); }
    #busy { position: fixed; inset: 0; background: rgba(255,255,255,.65); display: none; align-items: center; justify-content: center; z-index: 65;
      font-size: 17px; color: var(--primary-t); font-weight: 600; }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="side" id="side" hidden></aside>
    <div class="main">
      <header class="top" id="top" hidden>
        <div class="grow"><h1 id="pageTitle"></h1><div class="sub" id="pageSub"></div></div>
        <div id="topActions"></div>
      </header>
      <div class="subnav" id="subnav" hidden></div>
      <main id="view"></main>
      <footer id="foot"></footer>
    </div>
  </div>
  <nav class="bottom" id="bottom" aria-label="เมนูหลัก" hidden></nav>
  <div id="sheet"><section id="sheetBox" role="dialog" aria-modal="true"></section></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="bar" aria-hidden="true"></div>
  <div id="busy">กำลังบันทึก...</div>
<script>
/* =====================================================================
 * ส่วนหน้าเว็บ (ทำงานบนมือถือ/คอมพิวเตอร์ของผู้ใช้)
 * ออกแบบตามแคนวาส "ออกแบบ UI/UX ระบบยาฉีดจิตเวช รพ.สต."
 *  - มือถือ: เมนูล่างจอ 5 ปุ่ม | คอมพิวเตอร์ (กว้าง 768px ขึ้นไป): เมนูด้านข้าง
 *  - รพ.สต. เปิดมาเจอหน้า "วันนี้" กดยืนยันการฉีดได้ใน 1 แตะ (มีปุ่มย้อนกลับ)
 * ===================================================================== */

// ข้อมูลตั้งต้นจากเซิร์ฟเวอร์ (doGet ใน Code.gs)
const BOOT = <?!= bootJson ?>;
const LOAD_TIME = Date.now();                  // เวลาที่เปิดหน้า (ลิงก์ login หมดอายุใน 10 นาที)
let TOKEN = '';                                // session ของผู้ใช้
let ME = null;                                 // ข้อมูลผู้ใช้ที่ login อยู่
let CUR = '';                                  // หน้าปัจจุบัน
const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_M_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_DAY = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const ST_TH = { pending: 'รอฉีด', done: 'ฉีดแล้ว', missed: 'ไม่มาฉีด', cancelled: 'ยกเลิก' };

/* ---------- ตัวช่วยทั่วไป ---------- */
const $ = (id) => document.getElementById(id);
// กันข้อความแปลกปลอม (XSS) ก่อนแสดงบนหน้าเว็บ
const esc = (s) => String(s === null || s === undefined ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
// "2026-11-09" -> "9 พ.ย. 69"
function thd(iso) {
  if (!iso) return '';
  const p = String(iso).split('-');
  return Number(p[2]) + ' ' + TH_M[Number(p[1]) - 1] + ' ' + String(Number(p[0]) + 543).slice(-2);
}
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function isoOf(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function today() { return ME ? ME.today : isoOf(new Date()); }
function storeGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function storeSet(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }
/** "2026-11-12" -> "พฤหัสบดี 12 พ.ย. 69" */
function thLong(iso) { return TH_DAY[new Date(iso + 'T00:00:00').getDay()] + ' ' + thd(iso); }
/** บวก/ลบวัน */
function addDays(iso, n) { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return isoOf(d); }

/* ---------- แจ้งเตือนสั้น (มีปุ่ม "ย้อนกลับ" ได้) ---------- */
function toast(msg, ms, actLabel, act) {
  const t = $('toast');
  t.innerHTML = `<span>${esc(msg)}</span>${actLabel ? `<button id="toastAct">${esc(actLabel)}</button>` : ''}`;
  t.classList.add('open');
  if (actLabel) $('toastAct').onclick = () => { t.classList.remove('open'); act(); };
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('open'), ms || 3000);
}

/* ---------- สถานะกำลังโหลด: อ่าน = แถบบาง ๆ ด้านบน, บันทึก = บังหน้าจอกันกดซ้ำ ---------- */
let readCount = 0;
function progress(on) {
  readCount = Math.max(0, readCount + (on ? 1 : -1));
  const b = $('bar');
  if (readCount) { b.style.width = ''; b.classList.add('on'); }
  else { b.classList.remove('on'); b.style.width = '100%'; setTimeout(() => { if (!readCount) b.style.width = ''; }, 250); }
}
let busyCount = 0;
function busy(on) {
  busyCount = Math.max(0, busyCount + (on ? 1 : -1));
  const el = $('busy');
  clearTimeout(busy._t); clearTimeout(busy._s);
  if (!busyCount) { el.style.display = 'none'; return; }
  el.textContent = 'กำลังบันทึก...';
  busy._s = setTimeout(() => el.style.display = 'flex', 250);          // เร็วมากไม่ต้องกระพริบ
  busy._t = setTimeout(() => el.textContent = 'เครือข่ายช้า กำลังรอ... (ไม่ต้องกดซ้ำ)', 8000);
}

/**
 * เรียกคำสั่งฝั่งเซิร์ฟเวอร์ api(token, action, payload) แล้วรอผล
 * - คำสั่งอ่าน: เก็บผลไว้ในหน้าเว็บ 60 วินาที และลองใหม่อัตโนมัติ 1 ครั้งถ้าเน็ตสะดุด
 * - คำสั่งบันทึก: ไม่ลองซ้ำ (กันบันทึกซ้ำ) สำเร็จแล้วล้างผลที่เก็บไว้ทั้งหมด
 * - session หมดอายุ -> กลับหน้า login
 */
const READ_ACTIONS = ['listDispenses', 'calendar', 'pendingList', 'patientsNewOld', 'summary', 'listRequests',
  'lookupHn', 'todayList', 'dashboard'];
const WRITE_ACTIONS = ['saveDispense', 'cancelDispense', 'confirmInjection', 'backfillSubmit', 'reviewRequest',
  'updateUser', 'runAlertsNow', 'setupTrigger'];
const CLIENT_CACHE = new Map();
const CLIENT_CACHE_MS = 60000;

function call(action, payload, quiet) {
  const key = action + '|' + JSON.stringify(payload || {});
  const isRead = READ_ACTIONS.indexOf(action) >= 0;
  const isWrite = WRITE_ACTIONS.indexOf(action) >= 0;
  const hit = isRead && CLIENT_CACHE.get(key);
  if (hit && Date.now() - hit.t < CLIENT_CACHE_MS) return Promise.resolve(hit.d);
  const ind = quiet ? () => {} : (isWrite ? busy : progress);
  ind(true);
  return new Promise((resolve, reject) => {
    const attempt = (n) => {
      google.script.run
        .withSuccessHandler((s) => {
          ind(false);
          const r = JSON.parse(s);
          if (r.ok) {
            if (isRead) CLIENT_CACHE.set(key, { t: Date.now(), d: r.data });
            if (isWrite) CLIENT_CACHE.clear();
            return resolve(r.data);
          }
          if (r.error === 'SESSION_EXPIRED') { storeSet('pi_token', ''); showLogin('หมดเวลาใช้งาน กรุณาเข้าสู่ระบบใหม่'); }
          else toast(r.error, 6000);
          reject(new Error(r.error));
        })
        .withFailureHandler((e) => {
          if (isRead && n === 0) return setTimeout(() => attempt(1), 1000);
          ind(false);
          toast('เชื่อมต่อไม่สำเร็จ กรุณาตรวจสัญญาณอินเทอร์เน็ตแล้วลองใหม่', 6000);
          reject(e);
        })
        .api(TOKEN, action, payload || {});
    };
    attempt(0);
  });
}

/** เติม 0 ข้างหน้า HN ให้ครบ 9 หลัก ("1234" -> "000001234") */
function padHn(v) {
  const d = String(v || '').replace(/\D/g, '');
  return d && d.length <= 9 ? ('000000000' + d).slice(-9) : d;
}
/** ผูกช่อง HN: พิมพ์ได้ 1-9 หลัก ออกจากช่องแล้วเติม 0 ให้ */
function bindHn(el) {
  el.addEventListener('change', () => { el.value = padHn(el.value); });
}

/* ---------- เริ่มต้น / เข้าสู่ระบบ ---------- */
async function init() {
  $('foot').textContent = BOOT.footer;
  if (BOOT.session) storeSet('pi_token', BOOT.session);
  TOKEN = storeGet('pi_token') || BOOT.session;           // เบราว์เซอร์ไม่ให้เก็บข้อมูล -> ใช้ session ที่เพิ่งได้
  if (BOOT.notice && BOOT.notice.indexOf('pending:') === 0) return showPending(BOOT.notice.slice(8));
  if (!TOKEN) return showLogin(BOOT.error);
  $('view').innerHTML = skelCards(3);
  try {
    ME = await call('boot', {}, true);                      // ข้อมูลผู้ใช้ + หน้าแรก ในครั้งเดียว
  } catch (e) {
    if (e.message !== 'SESSION_EXPIRED' && !ME) {
      $('view').innerHTML = `<div class="center card"><h2>เชื่อมต่อไม่สำเร็จ</h2>
        <p class="muted">กรุณาตรวจสัญญาณอินเทอร์เน็ต แล้วกดลองใหม่</p>
        <button class="btn" onclick="init()">ลองใหม่</button></div>`;
    }
    return;
  }
  if (BOOT.notice === 'linked') toast('เชื่อม LINE สำเร็จ จะได้รับแจ้งเตือนทุกเช้า');
  startApp();
}

    ${staff && !ME.lineLinked ? `<button class="btn ghost block" style="justify-content:flex-start;margin-bottom:8px" data-act="line">${icon('line', 22)}<span style="flex:1;text-align:left">เชื่อม LINE รับแจ้งเตือน</span></button>` : ''}
    <button class="btn ghost block" style="justify-content:flex-start;color:var(--err-t)" data-act="logout">${icon('logout', 22)}<span style="flex:1;text-align:left">ออกจากระบบ</span></button>`, 'เมนูเพิ่มเติม');
  const box = $('sheetBox');
  box.querySelectorAll('[data-v]').forEach((b) => b.onclick = () => { closeModal(); go(b.dataset.v); });
  box.querySelectorAll('[data-act=logout]').forEach((b) => b.onclick = logout);
  box.querySelectorAll('[data-act=line]').forEach((b) => b.onclick = linkLine);
}

/** ออกจากระบบ: ลบ session ที่เซิร์ฟเวอร์ก่อน แล้วกลับหน้า login */
function logout() {
  closeModal();
  const t = TOKEN; TOKEN = ''; storeSet('pi_token', '');
  busy(true);
  google.script.run.withSuccessHandler(() => { busy(false); showLogin('ออกจากระบบแล้ว', true); })
    .withFailureHandler(() => { busy(false); showLogin('ออกจากระบบแล้ว', true); }).logout(t);
}

/** เชื่อม LINE (ห้องยา) เพื่อรับการ์ดสรุปทุกเช้า */
async function linkLine() {
  const url = await call('linkLineUrl');
  openModal(`<h2>เชื่อมบัญชี LINE</h2><p>เพื่อรับการ์ดสรุปนัดฉีดทุกเช้า</p>
    <a class="btn block" style="background:#06C755" href="${esc(url)}" target="_top">ไปหน้า LINE Login</a>
    <button class="btn ghost block" style="margin-top:8px" onclick="closeModal()">ยกเลิก</button>`, 'เชื่อม LINE');
}

function startApp() {
  ['side', 'top', 'bottom'].forEach((id) => $(id).hidden = false);
  renderShell();
  // เปิดจากการ์ด LINE -> ปฏิทินวันนี้ | รพ.สต. -> วันนี้ | ห้องยา -> หน้าแรก
  if (BOOT.view === 'day' || BOOT.view === 'calendar') go('calendar', { openDay: today() });
  else if (BOOT.view === 'requests') go('requests');
  else if (ME.role === 'pcu') go('today', { initial: ME.initial });
  else go('home', { initial: ME.initial });
}

/** เปลี่ยนหน้า */
function go(v, opt) {
  CUR = v;
  closeModal();
  const active = GROUP[v] || v;
  document.querySelectorAll('#side [data-v], #bottom [data-v]').forEach((b) => {
    const on = b.dataset.v === active;
    b.classList.toggle('on', on);
    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  $('pageTitle').textContent = pageTitle(v);
  $('pageSub').textContent = thLong(today()) + (ME.pcu ? ' · รพ.สต.' + ME.pcu : '');
  $('topActions').innerHTML = '';
  // แถบย่อยของกลุ่ม "ผู้ป่วย"
  if (GROUP[v]) {
    $('subnav').hidden = false;
    $('subnav').innerHTML = subTabs().map(([k, n]) => `<button data-sv="${k}" class="${k === v ? 'on' : ''}" ${k === v ? 'aria-current="page"' : ''}>${n}</button>`).join('');
    $('subnav').querySelectorAll('[data-sv]').forEach((b) => b.onclick = () => go(b.dataset.sv));
  } else $('subnav').hidden = true;
  const views = { home: vHome, today: vToday, scan: vScan, records: vRecords, calendar: vCalendar,
    newold: vPatients, summary: vSummary, history: vHistory, requests: vRequests, settings: vSettings };
  views[v](opt || {});
  window.scrollTo(0, 0);
}

      <div class="stat warn"><small>ค้างยืนยัน</small><b>${d.overdue} <span style="font-size:15px">ราย</span></b></div>
      <div class="stat"><small>คำขอรออนุมัติ</small><b>${d.pendingRequests} <span class="muted">รายการ</span></b></div>
      <div class="stat green"><small>จ่ายยาเดือนนี้</small><b>${d.ampMonth} <span class="muted">amp</span></b></div>

      ${d.pendingRequests && ME.role === 'admin' ? `<button class="btn ghost" data-go="requests">${icon('clock', 22)} คำขอรออนุมัติ <span class="count">${d.pendingRequests}</span></button>` : ''}

/* =====================================================================
 * หน้า "วันนี้" / ยืนยันการฉีด: การ์ดรายคน กดยืนยันได้ใน 1 แตะ
 * ===================================================================== */
let todayPcu = '';
async function vToday(opt) {
  const staff = ME.role !== 'pcu';
  if (opt.pcu !== undefined) todayPcu = opt.pcu;
  $('view').innerHTML = `
    <div class="row" style="margin-bottom:12px">
      ${staff ? `<select id="t_pcu" aria-label="เลือก รพ.สต.">${pcuOptions(todayPcu, 'ทุก รพ.สต.')}</select>` : ''}
      <button class="btn ghost" id="t_pdf">${icon('down', 20)} PDF วันนี้</button>
    </div>
    <div id="t_out">${skelCards(3)}</div>`;
  let list = [];
  const t = today();
  const drugLine = (i) => `${esc(shortDrug(i.drugName))} ${esc(i.doseMg)} mg IM · ${esc(i.ampPerDose)} amp · ครั้งที่ ${esc(i.cycleNo)}`;
  const allergy = (i) => i.allergy ? `<div class="allergy">${icon('alert', 18)} แพ้ยา: ${esc(i.allergy)}</div>` : '';
  const where = (i) => staff ? ' · รพ.สต.' + esc(i.pcu) : '';
  const daysLate = (d) => Math.round((new Date(t + 'T00:00:00') - new Date(d + 'T00:00:00')) / 86400000);

  const card = (i, over) => `
    <article class="pcard ${over ? 'overdue' : ''}">
      <div class="head"><div><div class="nm">${esc(i.name)}</div>
        <div class="hn">HN ${esc(i.hn)}${where(i)}${over ? ' · นัด ' + thd(i.scheduledDate) : ''}</div></div>
        ${over ? `<span class="badge b-overdue">เลย ${daysLate(i.scheduledDate)} วัน</span>` : ''}</div>
      <div>${drugLine(i)}</div>${allergy(i)}
      <div class="acts">
        <button class="btn act-main" data-act="${over ? 'sheet' : 'done'}" data-id="${esc(i.id)}">${icon('check', 20)} ฉีดแล้ว</button>
        <button class="btn ghost" data-act="missed" data-id="${esc(i.id)}">ไม่มา</button>
      </div>
      ${over ? '' : `<button class="linkbtn" style="align-self:flex-start" data-act="sheet" data-id="${esc(i.id)}">ฉีดวันอื่น / เพิ่มหมายเหตุ</button>`}
    </article>`;
  const doneRow = (i) => `
    <div class="pdone ${i.status === 'missed' ? 'missed' : ''}">
      <span class="ok">${icon(i.status === 'missed' ? 'x' : 'check', 20)}</span>
      <div class="grow"><div style="font-weight:600">${esc(i.name)}</div>
        <div class="muted">${i.status === 'missed' ? 'ไม่มาฉีด' : 'ฉีดแล้ว ' + thd(i.actualDate)}${where(i)}</div></div>
      <button class="linkbtn" data-act="sheet" data-id="${esc(i.id)}">แก้ไข</button>
    </div>`;
  const upRow = (i) => `
    <div class="prow"><span class="badge b-pending">${thd(i.scheduledDate)}</span>
      <div class="grow"><div class="nm">${esc(i.name)}</div><div class="sm">${drugLine(i)}${where(i)}</div></div>
      <button class="linkbtn" data-act="sheet" data-id="${esc(i.id)}">ยืนยัน</button></div>`;

  const render = () => {
    const over = list.filter((i) => i.status === 'pending' && i.scheduledDate < t);
    const todo = list.filter((i) => i.scheduledDate === t && i.status === 'pending');
    const fin = list.filter((i) => i.scheduledDate === t && i.status !== 'pending');
    const up = list.filter((i) => i.scheduledDate > t);
    let h = `<div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr))">
      <div class="stat blue"><small>ต้องฉีด</small><b>${todo.length}</b></div>
      <div class="stat warn"><small>ค้างยืนยัน</small><b>${over.length}</b></div>
      <div class="stat green"><small>ฉีดแล้ว</small><b>${fin.filter((i) => i.status === 'done').length}</b></div></div>`;
    if (over.length) h += `<div class="sec-title warn">${icon('info', 20)} ค้างยืนยัน (เลยวันนัด)</div>` + over.map((i) => card(i, true)).join('');
    if (todo.length || fin.length) h += `<div class="sec-title">นัดฉีดวันนี้</div>` + todo.map((i) => card(i, false)).join('') + fin.map(doneRow).join('');
    if (!over.length && !todo.length && !fin.length) h += `<div style="margin-top:14px">${emptyBox('วันนี้ไม่มีนัดฉีด', 'ไม่มีรายการค้างยืนยัน', 'ดูปฏิทินทั้งเดือน', 'calendar')}</div>`;
    if (up.length) h += `<div class="sec-title">นัดฉีดใน 7 วันข้างหน้า</div>` + up.map(upRow).join('');
    $('t_out').innerHTML = h;
    bindGo($('t_out'));
    $('t_out').querySelectorAll('[data-act]').forEach((b) => b.onclick = () => {
      const i = list.find((x) => x.id === b.dataset.id);
      if (b.dataset.act === 'sheet') openConfirm(i, render);
      else quick(i, b.dataset.act);
    });
  };
  // กดครั้งเดียว: ฉีดแล้ววันนี้ / ไม่มาฉีด พร้อมปุ่ม "ย้อนกลับ" 6 วินาที
  const quick = async (i, status) => {
    const prev = { status: i.status, actualDate: i.actualDate, note: i.note || '' };
    const patch = { status: status, actualDate: status === 'done' ? t : '', note: i.note || '' };
    await call('confirmInjection', Object.assign({ id: i.id }, patch));
    Object.assign(i, patch); render();
    toast((status === 'done' ? 'บันทึกฉีดแล้ว: ' : 'บันทึกไม่มาฉีด: ') + i.name, 6000, 'ย้อนกลับ', async () => {
      await call('confirmInjection', Object.assign({ id: i.id }, prev));
      Object.assign(i, prev); render(); toast('ย้อนกลับแล้ว');
    });
  };
  const load = async () => {
    $('t_out').innerHTML = skelCards(3);
    list = await call('todayList', { pcu: staff ? $('t_pcu').value : '' });
    render();
  };
  if (staff) $('t_pcu').onchange = () => { todayPcu = $('t_pcu').value; load(); };
  $('t_pdf').onclick = () => downloadPdf(staff ? $('t_pcu').value : ME.pcu, t);
  if (opt.initial) { list = opt.initial; render(); } else load();
}

/** แผ่นยืนยันการฉีด: เลือกผล + วันที่ฉีดจริง (ไม่จำเป็นต้องตรงวันนัด) + หมายเหตุ */
function openConfirm(i, onSaved) {
  const t = today();
  const canMiss = i.scheduledDate <= t;
  let st = i.status === 'missed' ? 'missed' : 'done';
  const dates = [];
  const addChip = (label, d) => { if (d <= t && !dates.some((x) => x[1] === d)) dates.push([label, d]); };
  addChip('วันนี้', t); addChip('เมื่อวาน', addDays(t, -1)); addChip('วันนัด ' + thd(i.scheduledDate), i.scheduledDate);
  const start = i.actualDate || (i.scheduledDate <= t ? i.scheduledDate : t);
  openModal(`
    <h2>ยืนยันการฉีด</h2>
    <div style="font-size:18px;font-weight:700">${esc(i.name)}</div>
    <div class="muted">HN ${esc(i.hn)} · ${esc(shortDrug(i.drugName))} ${esc(i.doseMg)} mg IM · ${esc(i.ampPerDose)} amp</div>
    <div class="muted" style="margin-bottom:8px">ครั้งที่ ${esc(i.cycleNo)} · วันนัด ${thd(i.scheduledDate)}${ME.role !== 'pcu' ? ' · รพ.สต.' + esc(i.pcu) : ''}</div>
    ${i.allergy ? `<div class="allergy" style="margin-bottom:8px">${icon('alert', 18)} แพ้ยา: ${esc(i.allergy)}</div>` : ''}
    <div class="fieldlabel">ผลการฉีด</div>
    <div class="seg" id="c_seg">
      <button data-st="done">${icon('check', 20)} ฉีดแล้ว</button>
      ${canMiss ? '<button data-st="missed">ไม่มาฉีด</button>' : ''}
      ${i.status !== 'pending' ? '<button data-st="pending">ยังไม่ฉีด</button>' : ''}
    </div>
    <div id="c_dw">
      <div class="fieldlabel">วันที่ฉีดจริง</div>
      <div class="chips" id="c_chips">${dates.map(([l, d]) => `<button data-d="${d}">${esc(l)}</button>`).join('')}</div>
      <label class="f">หรือเลือกวันที่<input type="date" id="c_dt" max="${t}" value="${start}"></label>
    </div>
    <label class="f" style="margin-top:10px">หมายเหตุ (ถ้ามี)<input id="c_note" maxlength="200" value="${esc(i.note || '')}" placeholder="เช่น ฉีดช้า 2 วัน เพราะ..."></label>
    <button class="btn block" id="c_ok" style="margin-top:16px;min-height:54px;font-size:18px">บันทึก</button>
    <button class="btn ghost block" style="margin-top:8px" onclick="closeModal()">ยกเลิก</button>`, 'ยืนยันการฉีด');
  const sync = () => {
    $('c_seg').querySelectorAll('[data-st]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.st === st)));
    $('c_dw').hidden = st !== 'done';
    $('c_chips').querySelectorAll('[data-d]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.d === $('c_dt').value)));
  };
  $('c_seg').querySelectorAll('[data-st]').forEach((b) => b.onclick = () => { st = b.dataset.st; sync(); });
  $('c_chips').querySelectorAll('[data-d]').forEach((b) => b.onclick = () => { $('c_dt').value = b.dataset.d; sync(); });
  $('c_dt').onchange = sync;
  sync();
  $('c_ok').onclick = async () => {
    const patch = { status: st, actualDate: st === 'done' ? $('c_dt').value : '', note: $('c_note').value.trim() };
    if (st === 'done' && !patch.actualDate) return toast('กรุณาเลือกวันที่ฉีดจริง');
    await call('confirmInjection', Object.assign({ id: i.id }, patch));
    Object.assign(i, patch);
    closeModal(); toast('บันทึกแล้ว'); onSaved(i);
  };
}

/* =====================================================================
 * ปฏิทินการฉีด: จุดสีแสดงสถานะ + รายชื่อของวันที่เลือก
 * ===================================================================== */
let calMonth = '';
let calPcu = '';
async function vCalendar(opt) {
  const staff = ME.role !== 'pcu';
  if (!calMonth) calMonth = today().slice(0, 7);
  if (BOOT.pcu && staff && !calPcu) { calPcu = BOOT.pcu; BOOT.pcu = ''; }
  if (opt.openDay) calMonth = opt.openDay.slice(0, 7);
  let selDay = opt.openDay || (calMonth === today().slice(0, 7) ? today() : '');
  $('view').innerHTML = `
    <div class="card">
      <div class="monthbar">
        <button class="iconbtn" id="c_prev" aria-label="เดือนก่อน">${icon('left', 22)}</button>
        <h2 id="c_title"></h2>
        <button class="iconbtn" id="c_next" aria-label="เดือนถัดไป">${icon('right', 22)}</button>
      </div>
      ${staff ? `<div style="margin-top:10px"><select id="c_pcu" aria-label="เลือก รพ.สต.">${pcuOptions(calPcu, 'ทุก รพ.สต.')}</select></div>` : ''}
      <div class="legend"><span><i class="dot d-done"></i>ฉีดแล้ว</span><span><i class="dot d-pending"></i>รอฉีด</span>
        <span><i class="dot d-overdue"></i>ค้างยืนยัน</span><span><i class="dot d-missed"></i>ไม่มา</span></div>
      <div class="cal" id="c_grid"></div>
    </div>
    <div id="c_day"></div>`;
  let items = [];
  const t = today();
  const pcuVal = () => staff ? $('c_pcu').value : ME.pcu;
  const draw = () => {
    const [y, m] = calMonth.split('-').map(Number);
    $('c_title').textContent = TH_M_FULL[m - 1] + ' ' + (y + 543);
    const first = new Date(y, m - 1, 1).getDay();
    const last = new Date(y, m, 0).getDate();
    let h = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'].map((d) => `<div class="h">${d}</div>`).join('');
    for (let k = 0; k < first; k++) h += '<div></div>';
    for (let d = 1; d <= last; d++) {
      const iso = calMonth + '-' + pad2(d);
      const l = items.filter((x) => x.scheduledDate === iso);
      const has = (f) => l.some(f);
      const dots = [
        has((x) => x.status === 'done') ? 'd-done' : '',
        has((x) => x.status === 'pending' && iso >= t) ? 'd-pending' : '',
        has((x) => x.status === 'pending' && iso < t) ? 'd-overdue' : '',
        has((x) => x.status === 'missed') ? 'd-missed' : ''
      ].filter(Boolean);
      h += `<button class="d ${iso === t ? 'today' : ''} ${iso === selDay ? 'sel' : ''}" data-d="${iso}"
        aria-label="${d} ${TH_M_FULL[m - 1]} ${l.length ? l.length + ' ราย' : 'ไม่มีนัด'}" ${iso === selDay ? 'aria-pressed="true"' : ''}>
        <span>${d}</span><span class="dots">${dots.map((c) => `<i class="dot ${c}"></i>`).join('')}</span>
        ${l.length ? `<span class="n">${l.length}</span>` : ''}</button>`;
    }
    $('c_grid').innerHTML = h;
    $('c_grid').querySelectorAll('[data-d]').forEach((b) => b.onclick = () => { selDay = b.dataset.d; draw(); showDay(); });
  };
  const showDay = () => {
    if (!selDay) { $('c_day').innerHTML = ''; return; }
    const l = items.filter((x) => x.scheduledDate === selDay).sort((a, b) => (a.pcu + a.name).localeCompare(b.pcu + b.name, 'th'));
    $('c_day').innerHTML = `
      <div class="row" style="align-items:center;margin:4px 0 10px">
        <div style="font-size:19px;font-weight:700">${thd(selDay)} · ${l.length} ราย</div>
        <button class="btn ghost sm" id="c_pdf" style="flex:0 0 auto">${icon('down', 18)} PDF</button>
      </div>
      ${l.length ? l.map((i) => `
        <div class="prow">
          <div class="grow"><div class="nm">${esc(i.name)}</div>
            <div class="sm">HN ${esc(i.hn)}${staff ? ' · รพ.สต.' + esc(i.pcu) : ''} · ${esc(shortDrug(i.drugName))} ${esc(i.doseMg)} mg · ครั้งที่ ${esc(i.cycleNo)}
            ${i.actualDate && i.actualDate !== i.scheduledDate ? ' · ฉีดจริง ' + thd(i.actualDate) : ''}</div></div>
          ${stBadge(i)}
          <button class="linkbtn" data-id="${esc(i.id)}">${i.status === 'pending' ? 'ยืนยัน' : 'แก้ไข'}</button>
        </div>`).join('') : `<div class="empty"><b>ไม่มีนัดฉีดวันนี้</b><div class="muted">เลือกวันอื่นในปฏิทิน</div></div>`}`;
    $('c_day').querySelectorAll('[data-id]').forEach((b) => b.onclick = () =>
      openConfirm(items.find((x) => x.id === b.dataset.id), () => { draw(); showDay(); }));
    $('c_pdf').onclick = () => pcuVal() ? downloadPdf(pcuVal(), selDay) : toast('กรุณาเลือก รพ.สต. ก่อนดาวน์โหลด PDF');
  };
  const load = async () => {
    if (staff) calPcu = $('c_pcu').value;
    items = await call('calendar', { month: calMonth, pcu: staff ? calPcu : '' });
    draw(); showDay();
  };
  const shift = (n) => {
    const [y, m] = calMonth.split('-').map(Number);
    const d = new Date(y, m - 1 + n, 1);
    calMonth = d.getFullYear() + '-' + pad2(d.getMonth() + 1);
    selDay = calMonth === t.slice(0, 7) ? t : '';
    load();
  };
  $('c_prev').onclick = () => shift(-1);
  $('c_next').onclick = () => shift(1);
  if (staff) $('c_pcu').onchange = load;
  draw(); load();
}

function setNewBadge(isNew) {

}


function fillForm(fields, flags) {
  FIELDS.forEach(([k]) => {
    const el = $('f_' + k);
    if (fields[k] !== undefined && fields[k] !== '') el.value = fields[k];
    el.classList.toggle('flag', !!flags[k]);
    $('m_' + k).textContent = flags[k] || '';
  });
}

function readForm() {
  const o = {}; FIELDS.forEach(([k]) => o[k] = $('f_' + k).value.trim()); return o;
}

/** ย่อภาพด้วย canvas แล้วคืนค่า base64 (JPEG) */
function resizeImage(file, max) {
  return new Promise((resolve, reject) => {
    const rd = new FileReader();
    rd.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
      };
      img.onerror = () => reject(new Error('เปิดภาพไม่ได้'));
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
}

/** ตรวจสอบกับเซิร์ฟเวอร์ แล้วแสดงตารางวันฉีด + ข้อผิดพลาด/คำเตือน */
async function checkScan() {

  if (v.errors.length) h += `<div class="alert err"><b>แก้ไขก่อนบันทึก</b><ul>${v.errors.map((e) => `<li>${esc(e)}</li>`).join('')}</ul></div>`;
  if (v.warnings.length) h += `<div class="alert warn"><b>คำเตือน</b><ul>${v.warnings.map((e) => `<li>${esc(e)}</li>`).join('')}</ul></div>`;
  if (v.computed) {
    const c = v.computed;
    h += `<div class="stat">ปีงบ<b>${c.fiscalYear}</b></div><div class="stat">ฉีด<b>${c.injCount} ครั้ง</b></div>
      ${c.everyMonths > 1 ? `<div class="stat">รอบฉีด<b>ทุก ${c.everyMonths} เดือน</b></div>` : ''}
      <div class="stat">ครั้งละ<b>${c.ampPerDose} amp</b></div><div class="stat">ควรจ่าย<b>${c.ampCalc} amp</b></div>
      <div class="tw"><table><tr><th>ครั้งที่</th><th>วันนัดฉีด</th></tr>
      ${c.schedule.map((d, i) => `<tr><td>${i + 1}</td><td>${thd(d)}</td></tr>`).join('')}
      <tr><td>-</td><td><b>พบแพทย์ ${thd(rec.appointmentDate)}</b> (เริ่มนับครั้งที่ 1 ใหม่)</td></tr></table></div>`;
  }
  if (!v.errors.length) {
    h += (v.warnings.length ? `<label style="display:block;margin:10px 0"><input type="checkbox" id="ack" style="width:auto"> ตรวจสอบกับสติ๊กเกอร์แล้ว ยืนยันบันทึกแม้มีคำเตือน</label>` : '') +
      `<button class="btn" id="btnSave" ${v.warnings.length ? 'disabled' : ''}>บันทึกข้อมูล</button>`;
  }
  card.innerHTML = h;
  scanChecked = !v.errors.length;
  setStep(scanChecked ? 3 : 2);
  if ($('ack')) $('ack').onchange = () => $('btnSave').disabled = !$('ack').checked;
  if ($('btnSave')) $('btnSave').onclick = async () => {
    if (!scanChecked) return toast('ข้อมูลถูกแก้ไข กรุณาตรวจสอบใหม่');
    const r = await call('saveDispense', { rec, ack: !!($('ack') && $('ack').checked) });
    if (r.saved) {
      toast('บันทึกแล้ว สร้างนัดฉีด ' + r.schedule.length + ' ครั้ง', 4000);
      vScan();
    } else {
      card.innerHTML = `<div class="alert err">${esc((r.errors.concat(r.warnings)).join(' | '))}</div>`;
    }
  };
  card.scrollIntoView({ behavior: 'smooth' });
}

/** ดาวน์โหลด PDF รายชื่อ */
async function downloadPdf(pcu, date) {
  if (!pcu) return toast('กรุณาเลือก รพ.สต. ก่อน');
  const r = await call('pdf', { pcu, date });
  const bin = atob(r.base64); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([arr], { type: 'application/pdf' }));
  const a = document.createElement('a'); a.href = url; a.download = r.fileName; a.target = '_blank';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  toast('ดาวน์โหลดแล้ว ถ้าไฟล์ไม่ขึ้น ให้เปิดหน้านี้ในเบราว์เซอร์ Chrome/Safari', 5000);
}

      <td>${tot.total}</td><td>${tot.done}</td><td>${tot.missed}</td><td>${tot.pending}</td></tr></table>`;
  };
  $('s_fy').onchange = () => { $('s_m').innerHTML = monthOpts(Number($('s_fy').value)); load(); };
  $('s_m').onchange = load; $('s_pcu').onchange = load;
  load();
}

/* =====================================================================
 * หน้า 7: ประวัติผู้ป่วยรายคน (นับครั้งที่ฉีดต่อเนื่อง)
 * ===================================================================== */
function vHistory() {
  $('view').innerHTML = `<div class="card"><h2>ประวัติการฉีดยาผู้ป่วย</h2><div class="row">
    <input id="h_hn" inputmode="numeric" maxlength="9" placeholder="HN (พิมพ์ 1234 ได้ ระบบเติม 0 ให้)"><button class="btn" id="h_go">ค้นหา</button></div></div>
    <div id="h_out"></div>`;
  const load = async () => {
    $('h_hn').value = padHn($('h_hn').value);
    const r = await call('patientHistory', { hn: $('h_hn').value });
    if (!r.found) { $('h_out').innerHTML = '<div class="card">ไม่พบ HN นี้</div>'; return; }
    $('h_out').innerHTML = `<div class="card"><h2>${esc(r.name)} HN ${esc(r.hn)}</h2>
      <div class="stat">รพ.สต.<b>${esc(r.pcu)}</b></div><div class="stat">รับยาครั้งแรก<b>${thd(r.firstDispenseDate)}</b></div>
      <div class="stat">ฉีดแล้วทั้งหมด<b>${r.totalDone} ครั้ง</b></div>
      ${r.allergy ? `<div class="alert err">แพ้ยา: ${esc(r.allergy)}</div>` : ''}</div>
      <div class="card tw"><h2>ไทม์ไลน์การฉีด</h2><table><tr><th>ครั้งที่ (ต่อเนื่อง)</th><th>ครั้งที่ (รอบจ่ายยา)</th><th>วันนัด</th><th>วันฉีดจริง</th><th>ยา</th><th>สถานะ</th></tr>
      ${r.timeline.map((i) => `<tr><td>${i.lifetimeNo || '-'}</td><td>${esc(i.cycleNo)}</td><td>${thd(i.scheduledDate)}</td><td>${thd(i.actualDate) || '-'}</td>
      <td>${esc(shortDrug(i.drugName))} ${esc(i.doseMg)} mg</td><td>${stBadge(i)}</td></tr>`).join('')}</table></div>
      <div class="card tw"><h2>ประวัติการจ่ายยา</h2><table><tr><th>วันจ่าย</th><th>รพ.สต.</th><th>ยา</th><th>วันที่ฉีด</th><th>จ่าย (amp)</th><th>นัดแพทย์</th><th>สถานะ</th></tr>
      ${r.dispenses.map((d) => `<tr><td>${thd(d.dispenseDate)}</td><td>${esc(d.pcu)}</td><td>${esc(shortDrug(d.drugName))} ${esc(d.doseMg)} mg</td>
      <td>${esc(d.days)}</td><td>${esc(d.qtyAmp)}</td><td>${thd(d.appointmentDate)}</td><td>${d.status === 'active' ? 'ใช้งาน' : 'ยกเลิก'}</td></tr>`).join('')}</table></div>`;
  };
  $('h_go').onclick = load;
  bindHn($('h_hn'));
  $('h_hn').addEventListener('keydown', (e) => { if (e.key === 'Enter') { $('h_hn').value = padHn($('h_hn').value); load(); } });
}

/* =====================================================================
 * หน้า 8: คำขอบันทึกย้อนหลัง (ยาไปฉีดก่อนมีข้อมูลในระบบ) — ผู้ดูแลระบบอนุมัติก่อนเข้าระบบ
 * ===================================================================== */

/** สร้างช่องกรอกตาม FIELDS โดยใช้ prefix ของ id (ใช้ซ้ำกับหน้าสแกน) */
function fieldInputs(prefix) {
  return FIELDS.map(([k, label, type, req]) => {
    const id = prefix + k;
    let ctrl;
    if (type === 'pcu') ctrl = `<select id="${id}">${pcuOptions(ME.pcu || '')}</select>`;
    else if (type === 'drug') ctrl = `<select id="${id}"><option value="">-- เลือกยา --</option>${ME.drugs.map((d) => `<option value="${esc(d.code)}">${esc(d.name)}</option>`).join('')}</select>`;
    else if (type === 'date') ctrl = `<input id="${id}" type="date" max="${k === 'dispenseDate' ? today() : ''}">`;
    else if (type === 'hn') ctrl = `<input id="${id}" inputmode="numeric" maxlength="9" autocomplete="off" placeholder="พิมพ์ 1234 ได้ ระบบเติม 0 ให้">`;
    else if (type === 'num') ctrl = `<input id="${id}" type="number" step="0.5" min="0" inputmode="decimal">`;
    else if (type === 'int') ctrl = `<input id="${id}" type="number" step="1" min="1" inputmode="numeric">`;
    else ctrl = `<input id="${id}" autocomplete="off">`;
    return `<label class="f">${label} ${req ? '<span class="req">*</span>' : ''}${ctrl}</label>`;
  }).join('');
}
function readFields(prefix) {
  const o = {}; FIELDS.forEach(([k]) => o[k] = $(prefix + k).value.trim()); return o;
}

async function vRequests() {
  const isAdmin = ME.role === 'admin';
  $('view').innerHTML = `
    <div class="card"><h2>ส่งคำขอบันทึกย้อนหลัง</h2>
      <p class="muted">ใช้เมื่อยาถูกนำไปฉีดแล้ว แต่ยังไม่มีข้อมูลในระบบ คำขอจะเข้าระบบหลังผู้ดูแลระบบอนุมัติ</p>
      <div class="grid">${fieldInputs('b_')}</div>
      <div style="margin-top:12px"><button class="btn blue" id="b_calc">คำนวณตารางนัด</button></div>
      <div id="b_out"></div>
    </div>
    <div class="card tw"><h2>${isAdmin ? 'คำขอทั้งหมด' : 'คำขอของฉัน'}</h2><div id="q_out"></div></div>`;
  bindHn($('b_hn'));
  let sched = [];
  // แก้ข้อมูลหลังคำนวณแล้ว = ต้องคำนวณใหม่
  FIELDS.forEach(([k]) => $('b_' + k).addEventListener('input', () => { sched = []; $('b_out').innerHTML = ''; }));

  $('b_calc').onclick = async () => {
    $('b_hn').value = padHn($('b_hn').value);
    const rec = readFields('b_');
    const v = await call('backfillPreview', { rec, skipOutcomes: true });
    let h = '';
    if (v.errors.length) h += `<div class="alert err"><ul>${v.errors.map((e) => `<li>${esc(e)}</li>`).join('')}</ul></div>`;
    if (v.warnings.length) h += `<div class="alert warn"><b>คำเตือน</b><ul>${v.warnings.map((e) => `<li>${esc(e)}</li>`).join('')}</ul></div>`;
    if (v.computed && !v.errors.length) {
      sched = v.computed.schedule;
      h += `<p class="muted">นัดที่ถึงวันแล้ว กรุณาระบุผลการฉีด | นัดล่วงหน้าจะเป็น "รอฉีด" หลังอนุมัติ</p>
        <table><tr><th>ครั้งที่</th><th>วันนัด</th><th>ผล</th><th>วันที่ฉีดจริง</th><th>หมายเหตุ</th></tr>
        ${sched.map((d, k) => d <= v.today ? `<tr><td>${k + 1}</td><td>${thd(d)}</td>
          <td><select id="o_s${k}"><option value="">-- เลือก --</option><option value="done">ฉีดแล้ว</option><option value="missed">ไม่มาฉีด</option></select></td>
          <td><input type="date" id="o_d${k}" value="${d}" max="${v.today}" min="${esc(rec.dispenseDate)}"></td>
          <td><input id="o_n${k}" maxlength="200"></td></tr>`
          : `<tr><td>${k + 1}</td><td>${thd(d)}</td><td colspan="3"><span class="badge b-pending">นัดล่วงหน้า</span></td></tr>`).join('')}</table>
        <label class="f" style="margin-top:10px">เหตุผลที่ต้องบันทึกย้อนหลัง <span class="req">*</span><input id="b_reason" maxlength="300" placeholder="เช่น จ่ายยาก่อนเริ่มใช้ระบบ"></label>
        ${v.warnings.length ? '<label style="display:block;margin:8px 0"><input type="checkbox" id="b_ack" style="width:auto"> ตรวจสอบแล้ว ยืนยันส่งแม้มีคำเตือน</label>' : ''}
        <button class="btn" id="b_send" style="margin-top:8px">ส่งคำขอให้ผู้ดูแลระบบอนุมัติ</button>`;
    }
    $('b_out').innerHTML = h;
    sched.forEach((d, k) => {
      const s = $('o_s' + k); if (!s) return;
      const sync = () => $('o_d' + k).style.visibility = s.value === 'missed' ? 'hidden' : 'visible';
      s.onchange = sync; sync();
    });
    if ($('b_send')) $('b_send').onclick = async () => {
      const outcomes = sched.map((d, k) => $('o_s' + k)
        ? { date: d, status: $('o_s' + k).value, actualDate: $('o_d' + k).value, note: $('o_n' + k).value.trim() } : null)
        .filter(Boolean);
      await call('backfillSubmit', { rec, outcomes, reason: $('b_reason').value.trim(), ack: !!($('b_ack') && $('b_ack').checked) });
      toast('ส่งคำขอแล้ว รอผู้ดูแลระบบอนุมัติ', 4000);
      go('requests');
    };
  };

  // รายการคำขอ
  const ST = { pending: ['b-pending', 'รออนุมัติ'], approved: ['b-done', 'อนุมัติแล้ว'], rejected: ['b-missed', 'ไม่อนุมัติ'] };
  const OUT = { done: 'ฉีดแล้ว', missed: 'ไม่มาฉีด' };
  const list = await call('listRequests');
  if (!list.length) { $('q_out').innerHTML = '<p class="muted">ยังไม่มีคำขอ</p>'; return; }
  $('q_out').innerHTML = list.map((r, n) => {
    const rec = r.rec || {};
    const drug = (ME.drugs.find((d) => d.code === rec.drugCode) || {}).name || rec.drugCode;
    let h = `<div style="border-top:1px solid var(--line);padding:10px 0">
      <span class="badge ${ST[r.status][0]}">${ST[r.status][1]}</span>
      <b>${esc(rec.name)}</b> HN ${esc(r.hn)} | รพ.สต.${esc(r.pcu)}<br>
      ${esc(shortDrug(drug))} ${esc(rec.doseMg)} mg วันที่ ${esc((rec.days || []).join(','))} | จ่ายยา ${thd(r.dispenseDate)} | นัดแพทย์ ${thd(rec.appointmentDate)} | ${esc(rec.qtyAmp)} amp<br>
      <span class="muted">เหตุผล: ${esc(r.reason)} | ส่งโดย ${esc(r.submittedBy)} ${esc(r.submittedAt)}</span>
      ${(r.outcomes || []).length ? `<br><span class="muted">ผลที่ระบุ: ${r.outcomes.map((o) => thd(o.date) + ' ' + (OUT[o.status] || '-') + (o.status === 'done' && o.actualDate !== o.date ? ' (ฉีดจริง ' + thd(o.actualDate) + ')' : '')).join(', ')}</span>` : ''}
      ${r.status !== 'pending' ? `<br><span class="muted">พิจารณาโดย ${esc(r.reviewedBy)} ${esc(r.reviewedAt)}${r.reviewNote ? ' : ' + esc(r.reviewNote) : ''}</span>` : ''}`;
    if (isAdmin && r.status === 'pending' && r.check) {
      const c = r.check;
      if (c.errors.length) h += `<div class="alert err">อนุมัติไม่ได้: ${c.errors.map(esc).join(' | ')}</div>`;
      if (c.warnings.length) h += `<div class="alert warn">${c.warnings.map(esc).join('<br>')}</div>`;
      h += `<div class="row" style="margin-top:6px">
        ${!c.errors.length ? `${c.warnings.length ? `<label class="muted" style="flex:0 0 auto"><input type="checkbox" id="q_ack${n}" style="width:auto"> ยืนยันคำเตือน</label>` : ''}
        <button class="btn sm" data-ok="${n}">อนุมัติ</button>` : ''}
        <input id="q_note${n}" placeholder="หมายเหตุ / เหตุผลที่ไม่อนุมัติ"><button class="btn red sm" data-no="${n}">ไม่อนุมัติ</button></div>`;
    }
    return h + '</div>';
  }).join('');
  $('q_out').querySelectorAll('[data-ok]').forEach((b) => b.onclick = async () => {
    const n = b.dataset.ok;
    const ack = $('q_ack' + n);
    if (ack && !ack.checked) return toast('กรุณาติ๊กยืนยันคำเตือนก่อน');
    const r = await call('reviewRequest', { id: list[n].id, decision: 'approve', ack: !!ack, note: $('q_note' + n).value.trim() });
    if (!r.done) return toast((r.errors.concat(r.warnings)).join(' | '), 6000);
    ME.pendingRequests = Math.max(0, (ME.pendingRequests || 1) - 1);
    toast('อนุมัติแล้ว ข้อมูลเข้าระบบเรียบร้อย'); go('requests');
  });
  $('q_out').querySelectorAll('[data-no]').forEach((b) => b.onclick = async () => {
    const n = b.dataset.no;
    await call('reviewRequest', { id: list[n].id, decision: 'reject', note: $('q_note' + n).value.trim() });
    ME.pendingRequests = Math.max(0, (ME.pendingRequests || 1) - 1);
    toast('บันทึกผลไม่อนุมัติแล้ว'); go('requests');
  });
}

/* =====================================================================
 * หน้า 9: ตั้งค่า (ผู้ดูแลระบบ)
 * ===================================================================== */
async function vSettings() {
  $('view').innerHTML = `<div class="card"><h2>การแจ้งเตือน LINE</h2><div class="row">
    <button class="btn" id="t_trig">ตั้งเวลาแจ้งเตือนทุกเช้า</button>
    <button class="btn blue" id="t_now">ส่งแจ้งเตือนวันนี้ทันที</button>
    <button class="btn ghost" id="t_test">ทดสอบส่งหาตัวเอง</button></div><div id="t_msg"></div></div>
    <div class="card tw"><h2>ผู้ใช้งาน</h2><p class="muted">ผู้ใช้ใหม่ต้องอนุมัติ (สถานะ "ใช้งาน") และผู้ใช้ รพ.สต. ต้องเลือก รพ.สต.</p><div id="u_out"></div></div>`;
  const msg = (t) => $('t_msg').innerHTML = `<div class="alert ok">${esc(t)}</div>`;
  $('t_trig').onclick = async () => msg(await call('setupTrigger'));
  $('t_now').onclick = async () => msg(await call('runAlertsNow'));
  $('t_test').onclick = async () => msg('ส่งสำเร็จ ' + await call('testLine') + ' คน');
  const load = async () => {
    const users = await call('listUsers');
    const pcuSel = (v) => `<option value="">-</option>` + ME.pcus.map((p) => `<option ${p === v ? 'selected' : ''}>${esc(p)}</option>`).join('');
    $('u_out').innerHTML = `<table><tr><th>ชื่อ</th><th>ประเภท</th><th>บทบาท</th><th>รพ.สต.</th><th>สถานะ</th><th>LINE</th><th></th></tr>
      ${users.map((u, k) => `<tr><td>${esc(u.displayName)}<br><span class="muted">${esc(u.email)}</span></td><td>${u.type === 'google' ? 'Google' : 'LINE'}</td>
      <td><select id="u_r${k}">${['pcu', 'pharmacy', 'admin'].map((r) => `<option value="${r}" ${u.role === r ? 'selected' : ''}>${{ pcu: 'รพ.สต.', pharmacy: 'ห้องยา', admin: 'ผู้ดูแลระบบ' }[r]}</option>`).join('')}</select></td>
      <td><select id="u_p${k}">${pcuSel(u.pcu)}</select></td>
      <td><select id="u_s${k}">${[['active', 'ใช้งาน'], ['pending', 'รออนุมัติ'], ['disabled', 'ปิดใช้งาน']].map(([v, n]) => `<option value="${v}" ${u.status === v ? 'selected' : ''}>${n}</option>`).join('')}</select></td>
      <td>${u.lineLinked ? 'เชื่อมแล้ว' : '-'}</td><td><button class="btn sm" data-u="${k}">บันทึก</button></td></tr>`).join('')}</table>`;
    $('u_out').querySelectorAll('[data-u]').forEach((b) => b.onclick = async () => {
      const k = b.dataset.u;
      await call('updateUser', { uid: users[k].uid, role: $('u_r' + k).value, pcu: $('u_p' + k).value, status: $('u_s' + k).value });
      toast('บันทึกแล้ว');
    });
  };
  load();
}


init();
</script>
